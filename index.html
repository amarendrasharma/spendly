<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <title>Spendly — Expense Tracker</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:28px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#2563eb;color:#fff;font-size:22px}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:#718096;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.file-label{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:14px}.secondary,.file-label{background:#e9eef8;color:#27405f}.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.card{background:#fff;border:1px solid #e7ebf3;border-radius:18px;padding:20px;box-shadow:0 6px 22px #223b6b0a}.balance{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:white}..balance small{opacity:.8}.balance h2{font-size:34px;margin:12px 0 20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f9fd;border-radius:14px;padding:14px}.stat b{display:block;margin-top:5px;font-size:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.field input,.field select{width:100%;padding:12px;border:1px solid #dbe2ee;border-radius:10px;background:#fff;color:inherit;font:inherit}.form-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.hint{font-size:12px;color:#718096}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:11px;border:1px solid #dbe2ee;border-radius:10px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:180px}.expense{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #edf0f5}.expense:last-child{border-bottom:0}.expense-main{display:flex;align-items:center;gap:12px;min-width:0}.expense-icon{width:40px;height:40px;border-radius:12px;background:#eff6ff;display:grid;place-items:center}.expense h3{font-size:15px;margin:0 0 4px}.expense p{margin:0;color:#718096;font-size:12px}.expense-right{text-align:right;white-space:nowrap}.amount{font-weight:800}.status{display:inline-block;font-size:11px;padding:4px 8px;border-radius:99px;margin-top:5px;font-weight:700}.completed{background:#dcfce7;color:#15803d}.pending{background:#fef3c7;color:#a16207}.cancelled{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#718096;padding:35px}.file-input{display:none}@media(max-width:720px){.hero{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-footer{align-items:flex-start;flex-direction:column}.expense-right{font-size:13px}}
    .balance small{opacity:.8}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><div class="logo">₹</div><div><h1>Spendly</h1><p>Simple, private expense tracking</p></div></div><div class="actions"><button class="secondary" id="exportBtn">Export JSON</button><label class="file-label">Import JSON<input class="file-input" id="importInput" type="file" accept="application/json"></label></div></header>
  <section class="hero"><div class="card balance"><small>Total spent this month</small><h2 id="monthTotal">₹0</h2><small id="monthLabel"></small></div><div class="card stats"><div class="stat"><small>All expenses</small><b id="count">0</b></div><div class="stat"><small>Completed</small><b id="completedCount">0</b></div><div class="stat"><small>Pending</small><b id="pendingCount">0</b></div><div class="stat"><small>Today</small><b id="todayTotal">₹0</b></div></div></section>
  <section class="card" style="margin-bottom:18px"><h2 style="margin:0 0 16px;font-size:18px">Add an expense</h2><form id="expenseForm"><div class="form-grid"><div class="field"><label for="amount">Amount (₹)</label><input id="amount" type="number" min="1" step="0.01" placeholder="450" required></div><div class="field"><label for="head">Spend head</label><input id="head" placeholder="Food, Shopping…" required></div><div class="field"><label for="note">Note / merchant</label><input id="note" placeholder="Merchant or person" required></div><div class="field"><label for="upi">Recipient UPI ID</label><input id="upi" placeholder="name@upi" required></div><div class="field"><label for="app">Payment app</label><select id="app"><option value="gpay">Google Pay</option><option value="phonepe">PhonePe</option><option value="paytm">Paytm</option><option value="bhim">BHIM</option><option value="other">Other / no app</option></select></div></div><div class="form-footer"><span class="hint">Enter the recipient UPI ID before launching payment.</span><button class="primary" type="submit">Save &amp; Pay</button></div></form></section>
  <section class="card"><div class="toolbar"><input id="search" placeholder="Search expenses…"><select id="filter"><option value="all">All statuses</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="cancelled">Cancelled</option></select><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select></div><div id="list"></div></section>
<section class="card" id="paymentPanel" style="display:none;margin:18px 0;background:#eff6ff;border-color:#bfdbfe"><strong>Expense saved as pending.</strong><p style="margin:6px 0 12px;color:#475569">Tap below to open your selected payment app.</p><a id="payLink" class="primary" style="display:inline-block;text-decoration:none">Open payment app</a></section></main>
<script>
const KEY='spendly-expenses-v1', DRAFT='spendly-draft-v1'; let expenses=JSON.parse(localStorage.getItem(KEY)||'[]');
const ₹=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const appNames={gpay:'Google Pay',phonepe:'PhonePe',paytm:'Paytm',bhim:'BHIM',other:'Other'};
function save(){localStorage.setItem(KEY,JSON.stringify(expenses)); render()}
function render(){const now=new Date(), month=now.getMonth(), year=now.getFullYear(); const monthly=expenses.filter(x=>{const d=new Date(x.date);return d.getMonth()===month&&d.getFullYear()===year}); document.querySelector('#monthTotal').textContent=₹(monthly.filter(x=>x.status==='completed').reduce((a,x)=>a+x.amount,0));document.querySelector('#monthLabel').textContent=now.toLocaleDateString('en-IN',{month:'long',year:'numeric'});document.querySelector('#count').textContent=expenses.length;document.querySelector('#completedCount').textContent=expenses.filter(x=>x.status==='completed').length;document.querySelector('#pendingCount').textContent=expenses.filter(x=>x.status==='pending').length;const day=now.toISOString().slice(0,10);document.querySelector('#todayTotal').textContent=₹(expenses.filter(x=>x.date.slice(0,10)===day&&x.status==='completed').reduce((a,x)=>a+x.amount,0)); const q=document.querySelector('#search').value.toLowerCase(), f=document.querySelector('#filter').value, list=expenses.filter(x=>(!q||`${x.head} ${x.note} ${appNames[x.app]}`.toLowerCase().includes(q))&&(f==='all'||x.status===f)).sort((a,b)=>document.querySelector('#sort').value==='new'?b.created-a.created:a.created-b.created); document.querySelector('#list').innerHTML=list.length?list.map(x=>`<article class="expense"><div class="expense-main"><div class="expense-icon">${x.app==='other'?'🧾':'💳'}</div><div><h3>${esc(x.head)}${x.note?` · ${esc(x.note)}`:''}</h3><p>${new Date(x.date).toLocaleDateString('en-IN')} · ${appNames[x.app]}</p></div></div><div class="expense-right"><div class="amount">${₹(x.amount)}</div><select class="status ${x.status}" onchange="setStatus('${x.id}',this.value)"><option value="completed" ${x.status==='completed'?'selected':''}>Completed</option><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Cancelled</option></select></div></article>`).join(''):'<div class="empty">No expenses yet. Add your first one above.</div>'}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setStatus(id,status){const x=expenses.find(e=>e.id===id);if(x){x.status=status;save()}}
document.querySelector('#expenseForm').onsubmit=e=>{e.preventDefault();const amount=Number(document.querySelector('#amount').value),head=document.querySelector('#head').value.trim(),note=document.querySelector('#note').value.trim(),upi=document.querySelector('#upi').value.trim(),app=document.querySelector('#app').value;const x={id:crypto.randomUUID(),amount,head,note,upi,app,status:'pending',date:new Date().toISOString(),created:Date.now()};expenses.push(x);save();e.target.reset();if(app!=='other'){const q=`pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(note||'Payment')}&am=${amount}&cu=INR`;const link=document.querySelector('#payLink');link.href=`upi://pay?${q}`;link.textContent=`Open ${appNames[app]}`;document.querySelector('#paymentPanel').style.display='block';document.querySelector('#paymentPanel').scrollIntoView({behavior:'smooth'});}}
['search','filter','sort'].forEach(id=>document.querySelector('#'+id).oninput=render);
['amount','head','note','upi','app'].forEach(id=>document.querySelector('#'+id).addEventListener('input',()=>{const draft={};['amount','head','note','upi','app'].forEach(k=>draft[k]=document.querySelector('#'+k).value);localStorage.setItem(DRAFT,JSON.stringify(draft))}));
document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(expenses,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`spendly-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#importInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();expenses=data;save();alert('Backup imported successfully.')}catch{alert('That file is not a valid Spendly backup.')}};r.readAsText(file)};
const draft=JSON.parse(localStorage.getItem(DRAFT)||'null');if(draft){['amount','head','note','upi','app'].forEach(id=>{if(draft[id]!=null)document.querySelector('#'+id).value=draft[id]})}document.querySelector('#monthLabel').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
